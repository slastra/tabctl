name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/mediator/ ./internal/client/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - name: End-to-end (mediator + CLI over a private D-Bus session)
        run: dbus-run-session -- python3 scripts/integration-test.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Bundles are generated, not committed — build them before testing.
      - run: ./scripts/build-extensions.sh
      - run: node --check extensions/chrome/background.js
      - run: node --check extensions/firefox/background.js
      - run: node --test extensions/test/*.test.mjs
